services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_BACKEND: auto
      LLM_PROVIDER: none
      ALLOW_REVIEWED_RULES: "true"
    volumes:
      - ./storage:/app/storage
      - ./knowledge_base:/app/knowledge_base
      - ./datasets:/app/datasets
    depends_on:
      - qdrant
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      QDRANT_URL: http://qdrant:6333
      UI_BACKEND: api
      API_URL: http://api:8000
      LLM_PROVIDER: none
    volumes:
      - ./storage:/app/storage
      - ./knowledge_base:/app/knowledge_base
      - ./datasets:/app/datasets
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
